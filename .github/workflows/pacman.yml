name: Generate Snake Contribution Graph

on:
    schedule:
        - cron: '0 */12 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Generate snake graph
              uses: Platane/snk@v3
              with:
                  github_user_name: eynarr
                  outputs: |
                      dist/snake.svg?color_snake=#58a6ff&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
                      dist/snake-dark.svg?color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

            - name: Push to output branch
              uses: crazy-max/ghaction-github-pages@v3
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
