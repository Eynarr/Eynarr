name: Generate Snake Contribution Graph

on:
    schedule:
        - cron: '0 */12 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Generate snake graph
              uses: Platane/snk@v3
              with:
                  github_user_name: eynarr
                  outputs: |
                      dist/snake.svg?color_snake=#58a6ff&color_dots=#ebedf0,#c0a7ff,#a78bfa,#8b5cf6,#6d28d9
                      dist/snake-dark.svg?color_snake=#58a6ff&color_dots=#161b22,#2e1065,#6d28d9,#a78bfa,#c4b5fd

            - name: Push to output branch
              uses: crazy-max/ghaction-github-pages@v3
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
